<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual right-of-way cross-section</title>
  <desc id="desc">Illustrative cross-section showing the approximate 250-foot planning envelope with trails, shoulders, travel lanes, and a median for the SR-177 Weber County segment.</desc>
  <defs>
    <style>
      .bg { fill: #f5f0e8; }
      .frame { fill: #fffdf9; stroke: #c8b89a; stroke-width: 2; }
      .ink { fill: #1a1a1a; }
      .muted { fill: #6b5e4e; }
      .trail { fill: #d4e4cf; }
      .buffer { fill: #eadcc1; }
      .shoulder { fill: #d7d7d7; }
      .lane { fill: #4d4d4d; }
      .median { fill: #b9b08a; }
      .rule { stroke: #c8b89a; stroke-width: 3; }
      .mono { font: 600 20px 'Source Sans 3', sans-serif; letter-spacing: 1.6px; }
      .title { font: 700 34px 'Source Sans 3', sans-serif; }
      .body { font: 400 24px 'Source Sans 3', sans-serif; }
      .small { font: 400 20px 'Source Sans 3', sans-serif; }
      .label { font: 700 22px 'Source Sans 3', sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="680" rx="20" />
  <rect class="frame" x="32" y="32" width="1136" height="616" rx="18" />

  <text x="72" y="96" class="mono muted">CONCEPTUAL RIGHT-OF-WAY CROSS-SECTION</text>
  <text x="72" y="142" class="title ink">What the planning footprint is trying to hold</text>
  <text x="72" y="180" class="body muted">This shows the general mix of travel lanes, median, shoulders, and trail space discussed in the current planning record. It is not to scale.</text>

  <line class="rule" x1="144" y1="292" x2="1056" y2="292" />
  <line class="rule" x1="144" y1="292" x2="144" y2="266" />
  <line class="rule" x1="1056" y1="292" x2="1056" y2="266" />
  <text x="456" y="252" class="label ink">Approximate 250-foot planning envelope</text>

  <rect x="144" y="320" width="112" height="110" class="trail" rx="8" />
  <rect x="256" y="320" width="78" height="110" class="buffer" rx="8" />
  <rect x="334" y="320" width="54" height="110" class="shoulder" rx="8" />
  <rect x="388" y="320" width="92" height="110" class="lane" rx="8" />
  <rect x="480" y="320" width="92" height="110" class="lane" rx="8" />
  <rect x="572" y="320" width="124" height="110" class="median" rx="8" />
  <rect x="696" y="320" width="92" height="110" class="lane" rx="8" />
  <rect x="788" y="320" width="92" height="110" class="lane" rx="8" />
  <rect x="880" y="320" width="54" height="110" class="shoulder" rx="8" />
  <rect x="934" y="320" width="78" height="110" class="buffer" rx="8" />
  <rect x="1012" y="320" width="44" height="110" class="trail" rx="8" />

  <text x="166" y="380" class="small ink">Trail</text>
  <text x="267" y="380" class="small ink">Buffer</text>
  <text x="340" y="380" class="small ink">Shoulder</text>
  <text x="416" y="380" class="small" fill="#f5f0e8">Lane</text>
  <text x="508" y="380" class="small" fill="#f5f0e8">Lane</text>
  <text x="603" y="380" class="small ink">Median</text>
  <text x="724" y="380" class="small" fill="#f5f0e8">Lane</text>
  <text x="816" y="380" class="small" fill="#f5f0e8">Lane</text>
  <text x="886" y="380" class="small ink">Shoulder</text>
  <text x="947" y="380" class="small ink">Buffer</text>
  <text x="1017" y="380" class="small ink">Trail</text>

  <text x="144" y="484" class="label ink">How to read this</text>
  <text x="144" y="518" class="small muted">The graphic illustrates the approximate program elements discussed in the planning record: four travel lanes, a median, and trail space on both sides.</text>
  <text x="144" y="548" class="small muted">It does not show a final surveyed width, frontage-road detail, exact interchange geometry, or parcel-by-parcel effects.</text>

  <rect x="72" y="592" width="1056" height="30" rx="8" fill="#f0e6d6" />
  <text x="92" y="613" class="small ink">Illustrative only. Not to scale and not an official engineering cross-section.</text>
</svg>