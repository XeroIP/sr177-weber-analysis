<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual property screening diagram</title>
  <desc id="desc">Illustrative diagram showing a conceptual 250-foot right-of-way envelope, a wider 500-foot noise review zone, and a three-step parcel lookup workflow for the SR-177 study corridor.</desc>
  <defs>
    <style>
      .bg { fill: #f5f0e8; }
      .frame { fill: #fffdf9; stroke: #c8b89a; stroke-width: 2; }
      .ink { fill: #1a1a1a; }
      .muted { fill: #6b5e4e; }
      .accent { fill: #b84c1e; }
      .zone { fill: #e9d8b4; stroke: #c8b89a; stroke-width: 2; }
      .row { fill: #b84c1e; }
      .rule { stroke: #c8b89a; stroke-width: 3; }
      .step { fill: #ffffff; stroke: #c8b89a; stroke-width: 2; }
      .mono { font: 600 20px 'Source Sans 3', sans-serif; letter-spacing: 1.6px; }
      .title { font: 700 34px 'Source Sans 3', sans-serif; }
      .body { font: 400 24px 'Source Sans 3', sans-serif; }
      .small { font: 400 18px 'Source Sans 3', sans-serif; }
      .label { font: 700 22px 'Source Sans 3', sans-serif; }
      .stepnum { font: 700 24px 'Source Sans 3', sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760" rx="20" />
  <rect class="frame" x="32" y="32" width="1136" height="696" rx="18" />

  <text x="72" y="96" class="mono muted">CONCEPTUAL PROPERTY SCREENING</text>
  <text x="72" y="142" class="title ink">How to screen a parcel before official maps exist</text>
  <text x="72" y="180" class="body muted">Orientation only until UDOT publishes official study maps</text>

  <rect class="frame" x="72" y="226" width="494" height="430" rx="14" />
  <text x="100" y="268" class="label ink">Conceptual corridor zones</text>
  <rect class="zone" x="118" y="402" width="402" height="120" rx="18" />
  <rect class="row" x="178" y="435" width="282" height="54" rx="16" />
  <line class="rule" x1="319" y1="354" x2="319" y2="568" />
  <text x="224" y="385" class="small muted">Approx. 500-foot noise review zone</text>
  <text x="217" y="468" class="small" fill="#f5f0e8">Approx. 250-foot right-of-way envelope</text>
  <text x="249" y="336" class="small ink">Possible centerline near 5100 West</text>
  <text x="121" y="602" class="small muted">Outside noise review</text>
  <text x="430" y="602" class="small muted">Outside noise review</text>
  <text x="124" y="638" class="small muted">This does not predict a final take. It only shows the screening logic used before official maps exist.</text>

  <rect class="frame" x="602" y="226" width="526" height="430" rx="14" />
  <text x="630" y="268" class="label ink">Parcel lookup workflow</text>

  <rect class="step" x="630" y="302" width="470" height="84" rx="12" />
  <circle cx="670" cy="344" r="24" class="accent" />
  <text x="662" y="352" class="stepnum" fill="#f5f0e8">1</text>
  <text x="712" y="346" class="label ink">Locate parcel</text>
  <text x="712" y="372" class="small muted">County assessor map</text>

  <line class="rule" x1="865" y1="388" x2="865" y2="420" />

  <rect class="step" x="630" y="430" width="470" height="84" rx="12" />
  <circle cx="670" cy="472" r="24" class="accent" />
  <text x="662" y="480" class="stepnum" fill="#f5f0e8">2</text>
  <text x="712" y="466" class="label ink">Wait for Draft SES map</text>
  <text x="712" y="492" class="small muted">Use UDOT's published alignment</text>

  <line class="rule" x1="865" y1="516" x2="865" y2="548" />

  <rect class="step" x="630" y="570" width="470" height="62" rx="12" />
  <circle cx="670" cy="595" r="24" class="accent" />
  <text x="662" y="603" class="stepnum" fill="#f5f0e8">3</text>
  <text x="712" y="592" class="label ink">Compare parcel</text>
  <text x="712" y="616" class="small muted">ROW, noise review, or outside</text>

  <rect x="72" y="680" width="1056" height="30" rx="8" fill="#f0e6d6" />
  <text x="92" y="701" class="small ink">Illustrative only. This diagram is not a parcel determination and should not be treated as an official alignment map.</text>
</svg>